<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockquote Example</title>
</head>
<body>
    <h1>Seseorang developer web</h1>
    <p>Pengalaman magan lebih dari 1 tahun di BUMM</p>
    <blockquote>
        Pengalaman tersebut membuat saya memiliki banyak portfolio untuk digunakan melamar kerja.
    </blockquote>
</body>
</html>
