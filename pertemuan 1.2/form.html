<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #2be669, #0b92c7);
        }
        .box {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            /* width: 50%;        */
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);     
        }

        .box .lb {
            width: 30%;
        }
        .box table input,select{
            width: 100%;
            /* border: none; */
            border-radius: 3px;
            height: 20px;
        }

        .box td {
            /* margin-bottom: 10px; */
            padding: 10px;
        }

        .box table{
            border:  none;
        }    

        .box .btn {
            background-color: rgb(31, 132, 248);
            /* color: white; */
            border: none;
            box-shadow: 0px 8px 10px rgba(0, 0, 0, 0.1);            
        }
        .box .btn_reset {
            background-color: rgb(126, 128, 131);
            color: white;
            border: none;
            box-shadow: 0px 8px 10px rgba(0, 0, 0, 0.1);            
        }
    </style>
</head>
