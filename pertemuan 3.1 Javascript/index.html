<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Slider</title>

<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    /* background: linear-gradient(135deg, #007bff, #00c6ff); */
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

}

.slider-container{
    width:100%;
    max-width:700px;
    height:100px;
    overflow:hidden;
    position:relative;
}

.slide-text{
    position:absolute;
    width:100%;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color: #857251;
    transform:translateY(100%);
    opacity:0;
    transition:all 0.8s ease-in-out;
}

.slide-text.active{
    transform:translateY(0);
    opacity:1;
}

.slide-text.exit{
    transform:translateY(-100%);
    opacity:0;
}
</style>

</head>
<body>

<div class="slider-container">
    <div class="slide-text active">✈️ Selamat Sampai Tujuan dengan Aman & Nyaman</div>
    <div class="slide-text">🚌 Travel Cepat, Tepat Waktu & Terpercaya</div>
    <div class="slide-text">🎒 Antar Jemput Door to Door Service</div>
    <div class="slide-text">🌍 Perjalanan Nyaman Bersama Kami</div>
</div>

<script>
const slides = document.querySelectorAll(".slide-text");
let index = 0;

setInterval(() => {
    slides[index].classList.remove("active");
    slides[index].classList.add("exit");

    index = (index + 1) % slides.length;

    slides[index].classList.remove("exit");
    slides[index].classList.add("active");
}, 3000);
</script>

</body>
</html>
