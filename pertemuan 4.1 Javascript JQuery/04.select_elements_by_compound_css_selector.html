<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04.select_elements_by_compound_css_selector.html</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function(){
            // Highlight hanya paragraf elements dengan class mark
            $("p.mark").css("background", "yellow");

            // Highlight hanya span elements didalam element dengan ID mark
            $("#mark span").css("background", "yellow");

            // Highlight li elements didalam ul elements
            $("ul li").css("background", "yellow");

            // Highlight li elements didalam ul elementm dengan id mark
            $("ul#mark li").css("background", "red");

            // Highlight li elements didalam ul elementm dengan class mark
            $("ul.mark li").css("background", "green");

            // Highlight semua anchor element dengan target blank
            $('a[target="_blank"]').css("background", "yellow");
        });
    </script>
</head>
<body>
    <p>This is a paragraf.</p>
    <p class="mark">This is another paragraph.</p>
    <p>This is on more paragraph.</p>
    <ul>
        <li>List utem one</li>
        <li>List utem two</li>
        <li>List utem three</li>
    </ul>
    <ul id="mark">
        <li>List utem one</li>
        <li>List utem two</li>
        <li>List utem three</li>
    </ul>
    <ul class="mark">
        <li>List utem one</li>
        <li>List utem two</li>
        <li>List utem three</li>
    </ul>

    <p>Go to <a href="http://jti.polije.ac.id/" target="_blank">JTI</a></p>

</body>
</html>
