<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06.jQuery_Events_MouseaEvwnts_click()Method</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
        p{
            padding: 20px;
            font: 20px sans-serif;
            background: khaki;
            cursor: pointer;
        }
    </style>
    <script>
        $("p:odd").css("background", "yellow");
        $("p:even").css("background", "red");

        $(document).ready(function(){
            $("p").dblclick(function(){
                $(this).slideUp();
            });
        });
    </script>    
</head>
<body>
    <p>Double-click on me and I'Il disappear</p>
    <p>Double-click on me and I'Il disappear</p>
    <p>Double-click on me and I'Il disappear</p>
</body>
</html>
