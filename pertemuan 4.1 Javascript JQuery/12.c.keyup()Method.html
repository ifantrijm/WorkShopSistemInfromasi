<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12.c.keyup()Method</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
        p{
            padding: 20px;
            background: lightgreen;
            display: none;
        }

        div {
            margin: 20px 0;
        }

    </style>
    <script>
        $(document).ready(function(){
            var i = 0;
            $('input[type="text"]').keyup(function(){
                $('span').text(i += 1);
                $("p").show().fadeOut();
            });
        });
    </script>    
</head>
<body>
    <input type="text">
    <div>Keypress: <span>0</span></div>
    <div><strong>Note:</strong> Enter something inside thr input box and see the result.</div>
    <p>Keypress is triggerred</p>
</body>
</html>
